type: object
description: Краткая модель фестиваля для списков
required:
  - id
  - name
  - startDateTime
  - endDateTime
  - address
  - organizer
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  startDateTime:
    type: string
    format: date-time
  endDateTime:
    type: string
    format: date-time
  address:
    type: string
  description:
    type: string
    nullable: true
  organizer:
    $ref: './OrganizerShort.yaml'