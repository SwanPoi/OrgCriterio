type: object
description: Создание/редактирование шаблона формы
required:
  - name
  - isPublic
  - criterios
  - formula
  - hasComment
properties:
  name:
    type: string
  genre:
    type: string
    nullable: true
  isPublic:
    type: boolean
  criterios:
    type: array
    items:
      $ref: './FormCriterio.yaml'
  formula:
    $ref: './FormulaNode.yaml'
  hasComment:
    type: boolean