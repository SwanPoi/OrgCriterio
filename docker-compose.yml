version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orgcriterio_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=local
      - HTTP_ADDRESS=0.0.0.0:8080
      - LOG_LEVEL=info
      - DATABASE_DSN=postgres://postgres:test@postgres:5432/orgcriterio?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: orgcriterio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orgcriterio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orgcriterio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: