version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=local
      - HTTP_ADDRESS=0.0.0.0:8080
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      # В будущем здесь можно будет добавить подключение к БД:
      # - DB_HOST=postgres
    # depends_on:
